<script>
async function loadMeetings() {
  const res = await fetch("/.netlify/functions/zoomMeetings");
  const meetings = await res.json();

  const list = document.getElementById("meetings");
  list.innerHTML = "";

  meetings.forEach(m => {
    const li = document.createElement("li");
    li.innerHTML = `
      <strong>${m.topic}</strong><br>
      📅 ${new Date(m.start_time).toLocaleString()}<br>
      🔗 <a href="${m.join_url}" target="_blank">Join Meeting</a>
      <hr>
    `;
    list.appendChild(li);
  });
}

loadMeetings();
</script>

<ul id="meetings"></ul>
